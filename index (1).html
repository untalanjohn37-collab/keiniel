<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Keiniel 💗</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ffd6e7,#fff5f8);
}

.container{
    text-align:center;
    position:relative;
    z-index:5;
}

.title{
    color:#d81b60;
    font-size:28px;
    margin-bottom:30px;
}

.envelope{
    position:relative;
    width:300px;
    height:200px;
    margin:auto;
    cursor:pointer;
    transition:.4s;
}

.envelope:hover{transform:scale(1.05)}

.envelope-body{
    position:absolute;
    inset:0;
    background:#ff91b5;
    border-radius:10px;
    box-shadow:0 15px 35px rgba(0,0,0,.2);
}

.letter{
    position:absolute;
    width:260px;
    height:170px;
    left:20px;
    top:15px;
    padding:25px 15px;
    background:white;
    border-radius:8px;
    z-index:2;
    transition:1s;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.letter h2{color:#d81b60;margin-bottom:12px}
.letter p{color:#555;font-size:14px}

.flap{
    position:absolute;
    top:0;
    left:0;
    width:0;
    height:0;
    border-left:150px solid transparent;
    border-right:150px solid transparent;
    border-top:110px solid #ff6f9d;
    transform-origin:top;
    transition:.8s;
    z-index:3;
}

.envelope.open .flap{transform:rotateX(180deg)}
.envelope.open .letter{transform:translateY(-150px)}

.open-btn{
    margin-top:55px;
    padding:14px 30px;
    border:0;
    border-radius:30px;
    background:#d81b60;
    color:white;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(216,27,96,.3);
}

.open-btn:hover{background:#ad1457;transform:scale(1.06)}

.message-box{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:rgba(0,0,0,.55);
    opacity:0;
    visibility:hidden;
    transition:.5s;
    z-index:20;
}

.message-box.show{opacity:1;visibility:visible}

.message{
    width:min(600px,95%);
    background:white;
    padding:35px;
    border-radius:22px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
    animation:popUp .5s ease;
}

.message h1{
    color:#d81b60;
    font-size:30px;
    margin-bottom:25px;
}

#typedMessage{
    color:#444;
    font-size:20px;
    line-height:1.7;
    min-height:100px;
}

.close-btn{
    margin-top:25px;
    padding:10px 25px;
    border:0;
    border-radius:25px;
    background:#eee;
    color:#555;
    cursor:pointer;
}

.heart{
    position:fixed;
    bottom:-30px;
    pointer-events:none;
    animation:floatUp linear forwards;
}

.rose{
    position:fixed;
    top:-40px;
    pointer-events:none;
    animation:fall linear forwards;
}

@keyframes floatUp{
    0%{transform:translateY(0) scale(1);opacity:0}
    20%{opacity:1}
    100%{transform:translateY(-110vh) scale(1.5);opacity:0}
}

@keyframes fall{
    0%{transform:translateY(-40px) rotate(0);opacity:0}
    15%{opacity:1}
    100%{transform:translateY(110vh) rotate(360deg);opacity:0}
}

@keyframes popUp{
    from{transform:scale(.7);opacity:0}
    to{transform:scale(1);opacity:1}
}

@media(max-width:500px){
    .title{font-size:23px}
    .envelope{width:260px;height:175px}
    .flap{
        border-left-width:130px;
        border-right-width:130px;
        border-top-width:95px;
    }
    .letter{width:225px;height:145px;left:17px}
    .message{padding:25px}
    .message h1{font-size:25px}
    #typedMessage{font-size:17px}
}
</style>
</head>

<body>

<div class="container">
    <h1 class="title">A Little Something For You 💗</h1>

    <div class="envelope" id="envelope" onclick="openMessage()">
        <div class="envelope-body"></div>

        <div class="letter">
            <h2>For Keiniel 💌</h2>
            <p>Open this little message...</p>
        </div>

        <div class="flap"></div>
    </div>

    <button class="open-btn" onclick="openMessage()">
        Open My Message 💗
    </button>
</div>

<div class="message-box" id="messageBox">
    <div class="message">
        <h1>KEINIEL 💗</h1>
        <p id="typedMessage"></p>

        <button class="close-btn" onclick="closeMessage()">
            Close 💕
        </button>
    </div>
</div>

<script>
const envelope = document.getElementById("envelope");
const messageBox = document.getElementById("messageBox");
const typedMessage = document.getElementById("typedMessage");

const message = `KEINIEL, Can I ask you out after the exam? 💗

I just wanted to ask you in a simple and special way. No pressure, okay? I just want to spend some time with you after the exam and get to know you more. 😊

Good luck sa exam! You got this. See you after! ❤️`;

let index = 0;
let typingStarted = false;

function openMessage(){
    envelope.classList.add("open");
    messageBox.classList.add("show");

    if(!typingStarted){
        typingStarted = true;
        typeWriter();
    }
}

function closeMessage(){
    messageBox.classList.remove("show");
}

function typeWriter(){
    if(index < message.length){
        typedMessage.textContent += message.charAt(index);
        index++;
        setTimeout(typeWriter,70);
    }
}

function createHeart(){
    const heart=document.createElement("div");
    heart.className="heart";
    heart.textContent="❤️";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(Math.random()*15+15)+"px";
    heart.style.animationDuration=(Math.random()*4+4)+"s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),8000);
}

function createRose(){
    const rose=document.createElement("div");
    rose.className="rose";
    rose.textContent="🌹";
    rose.style.left=Math.random()*100+"vw";
    rose.style.fontSize=(Math.random()*12+20)+"px";
    rose.style.animationDuration=(Math.random()*4+5)+"s";
    document.body.appendChild(rose);
    setTimeout(()=>rose.remove(),9000);
}

setInterval(createHeart,700);
setInterval(createRose,1200);
</script>

</body>
</html>
